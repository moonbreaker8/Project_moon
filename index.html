<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>형원 💗 수민이의 오사카 여행</title>
<meta name="description" content="2026.10.24 ~ 10.27 오사카·교토 3박4일 여행 일정">
<meta name="theme-color" content="#1B1F3B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23FF5FA2' d='M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2.2 0 3.6 1.2 5.4 3.2 1.8-2 3.2-3.2 5.4-3.2 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 토큰 ===== */
:root {
  --pink: #FF5FA2;
  --red: #E63946;
  --yellow: #FFC93C;
  --navy: #1B1F3B;

  --bg: #FFF8EE;
  --surface: #FFFFFF;
  --surface-2: #FFF0DC;
  --ink: #1B1F3B;
  --ink-2: #4A4E6A;
  --muted: #6E7189;
  --line: rgba(27, 31, 59, .10);
  --pink-ink: #C8246B;       /* 밝은 배경 위 핑크 글자 (대비 확보) */
  --red-ink: #B8202D;
  --yellow-bg: #FFF1C2;
  --yellow-ink: #6B4E00;
  --red-bg: #FDE2E4;
  --pink-bg: #FFE3EF;
  --shadow: 0 2px 4px rgba(27, 31, 59, .05), 0 8px 24px rgba(27, 31, 59, .08);
  --glow: 0 0 6px rgba(255, 95, 162, .35);
  --radius: 18px;
  --tab-h: 68px;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --display: "Dela Gothic One", "Noto Sans KR", sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1F3B;
    --surface: #252A4D;
    --surface-2: #2F355E;
    --ink: #FFF4E6;
    --ink-2: #D2D4E8;
    --muted: #A5A8C4;
    --line: rgba(255, 255, 255, .10);
    --pink-ink: #FF8DC0;
    --red-ink: #FF8A93;
    --yellow-bg: rgba(255, 201, 60, .16);
    --yellow-ink: #FFD866;
    --red-bg: rgba(230, 57, 70, .2);
    --pink-bg: rgba(255, 95, 162, .16);
    --shadow: 0 2px 4px rgba(0, 0, 0, .25), 0 10px 28px rgba(0, 0, 0, .3);
    --glow: 0 0 8px rgba(255, 95, 162, .8), 0 0 22px rgba(255, 95, 162, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1F3B; --surface: #252A4D; --surface-2: #2F355E; --ink: #FFF4E6; --ink-2: #D2D4E8;
  --muted: #A5A8C4; --line: rgba(255, 255, 255, .10); --pink-ink: #FF8DC0; --red-ink: #FF8A93;
  --yellow-bg: rgba(255, 201, 60, .16); --yellow-ink: #FFD866; --red-bg: rgba(230, 57, 70, .2);
  --pink-bg: rgba(255, 95, 162, .16); --shadow: 0 2px 4px rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.3);
  --glow: 0 0 8px rgba(255, 95, 162, .8), 0 0 22px rgba(255, 95, 162, .45);
  color-scheme: dark;
}

/* ===== 기본 ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.6 var(--font);
  word-break: keep-all;
  overflow-wrap: anywhere;
  overflow-x: hidden;
}
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; border-radius: 8px; }

.app {
  max-width: 540px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px);
}
main { padding: 0 16px; outline: none; }

/* ===== 헤더: 도톤보리 밤 + 초친 ===== */
.top {
  position: relative;
  background:
    radial-gradient(120% 80% at 80% 0%, rgba(255, 95, 162, .28), transparent 60%),
    radial-gradient(90% 70% at 0% 100%, rgba(255, 201, 60, .18), transparent 60%),
    var(--navy);
  color: #FFF4E6;
  padding: 72px 20px 26px;
  border-radius: 0 0 28px 28px;
  overflow: hidden;
  text-align: center;
}
.lanterns { position: absolute; inset: 0 0 auto 0; height: 70px; pointer-events: none; }
.lanterns .string { position: absolute; left: 0; top: 0; width: 100%; height: 30px; }
.lantern {
  position: absolute; width: 26px; height: 46px;
  transform-origin: 50% 0;
  filter: drop-shadow(0 0 8px rgba(255, 140, 80, .55));
}
.l1 { left: 7%;  top: 10px; }
.l2 { left: 27%; top: 17px; width: 30px; height: 52px; }
.l3 { left: 48%; top: 13px; }
.l4 { left: 68%; top: 9px;  width: 30px; height: 52px; }
.l5 { left: 88%; top: 5px; }
.kana {
  margin: 0 0 6px;
  font: 400 15px/1 var(--display);
  letter-spacing: .25em;
  color: var(--yellow);
  opacity: .9;
}
.title {
  margin: 0;
  font-weight: 900;
  font-size: clamp(26px, 7.4vw, 34px);
  line-height: 1.25;
  letter-spacing: -.01em;
}
.title .neon {
  font-size: 1.18em;
  color: #fff;
  text-shadow: 0 0 6px rgba(255, 95, 162, .9), 0 0 18px rgba(255, 95, 162, .6), 0 0 32px rgba(255, 95, 162, .35);
}
.together {
  display: inline-flex; align-items: center; gap: 6px;
  margin: 12px 0 0; padding: 3px 12px;
  border: 1px solid rgba(255, 95, 162, .55); border-radius: 999px;
  background: rgba(255, 95, 162, .12);
  font-size: 15px; color: #FFE3EF;
}
.together b { font: 400 15px/1.4 var(--display); color: #fff; letter-spacing: .03em; text-shadow: 0 0 8px rgba(255, 95, 162, .8); }
.mini-heart { width: 14px; height: 14px; fill: var(--pink); }
.heart {
  display: inline-block;
  width: .95em; height: .95em;
  vertical-align: -.12em;
  fill: var(--pink);
  filter: drop-shadow(0 0 6px rgba(255, 95, 162, .8));
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.18); }
  30% { transform: scale(1); }
  45% { transform: scale(1.1); }
}
@media (prefers-reduced-motion: no-preference) {
  .lantern { animation: sway 4s ease-in-out infinite; }
  .l2 { animation-delay: -1s; } .l3 { animation-delay: -2.2s; } .l4 { animation-delay: -.6s; } .l5 { animation-delay: -3s; }
}
@keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@media (prefers-reduced-motion: reduce) {
  .heart { animation: none; }
  * { scroll-behavior: auto !important; }
}

/* ===== 공통 블록 ===== */
.section-title {
  margin: 30px 0 12px;
  font-size: 20px;
  font-weight: 900;
  display: flex; align-items: center; gap: 8px;
}
.section-title .glow { color: var(--pink-ink); text-shadow: var(--glow); }
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  border: 1px solid var(--line);
}
.stack > * + * { margin-top: 12px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 9px;
  border-radius: 999px;
  font-size: 15px; font-weight: 700; line-height: 1.6;
  background: var(--surface-2); color: var(--ink-2);
  white-space: nowrap;
}
.badge.yellow { background: var(--yellow-bg); color: var(--yellow-ink); }
.badge.red { background: var(--red-bg); color: var(--red-ink); }
.badge.pink { background: var(--pink-bg); color: var(--pink-ink); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px;
  border-radius: 12px; border: 0;
  background: var(--navy); color: #fff;
  font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer;
}
:root[data-theme="dark"] .btn { background: var(--pink); color: var(--navy); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { background: var(--pink); color: var(--navy); } }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.maplink {
  color: inherit; text-decoration: underline; text-decoration-color: var(--pink);
  text-decoration-thickness: 2px; text-underline-offset: 3px;
}
.maplink::after { content: " ↗"; font-size: .85em; color: var(--pink-ink); }

/* 사진 + 플레이스홀더 */
.ph {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, #FF5FA2 0%, #E63946 50%, #FFC93C 100%);
  display: grid; place-items: center;
}
.ph::before {
  content: attr(data-emoji);
  font-size: clamp(36px, 12vw, 56px);
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.25));
}
.ph.navy { background: linear-gradient(135deg, #1B1F3B, #463a7a 60%, #FF5FA2); }
.ph img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover;
}

/* ===== 홈 ===== */
.hero { margin-top: 18px; display: grid; grid-template-columns: 1fr; gap: 14px; }
.dday {
  text-align: center;
  padding: 18px 16px 16px;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 2px solid var(--pink);
}
.dday .big {
  font: 400 clamp(44px, 15vw, 64px)/1.05 var(--display);
  color: var(--pink-ink);
  text-shadow: var(--glow);
  letter-spacing: .02em;
}
.dday .sub { font-size: 15px; color: var(--muted); margin-top: 4px; }
.dday .clock { font: 400 18px/1.3 var(--display); color: var(--ink-2); margin-top: 6px; font-variant-numeric: tabular-nums; }
.concept { font-weight: 700; font-size: 18px; margin: 8px 0 0; }
.concept em { font-style: normal; color: var(--red-ink); }

.polaroid {
  background: #fff;
  padding: 8px 8px 30px;
  border-radius: 6px;
  box-shadow: 0 6px 18px rgba(27, 31, 59, .18);
  position: relative;
}
.polaroid .ph { aspect-ratio: 720 / 580; border-radius: 3px; }
.polaroid figcaption {
  position: absolute; left: 0; right: 0; bottom: 4px;
  text-align: center; font-size: 15px; color: #4A4E6A; font-weight: 700;
}
.hero .polaroid { transform: rotate(-1.5deg); margin: 4px 6px 0; }

.flight { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 10px; }
.flight .pt b { display: block; font: 400 26px/1.1 var(--display); }
.flight .pt span { font-size: 15px; color: var(--muted); }
.flight .pt:last-child { text-align: right; }
.flight .plane { font-size: 22px; color: var(--pink-ink); }
.flight-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.flight-head h3 { margin: 0; font-size: 17px; }
.flight-note { margin-top: 10px; font-size: 15px; font-weight: 700; color: var(--red-ink); }

.must { list-style: none; margin: 0; padding: 0; }
.must li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); }
.must li:first-child { border-top: 0; padding-top: 0; }
.must .d { font: 400 17px/1.4 var(--display); color: var(--pink-ink); }
.must .t { display: flex; flex-direction: column; gap: 2px; }
.must .t b { font-variant-numeric: tabular-nums; margin-right: 6px; }

.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; padding: 4px 4px 0; }
.gallery .polaroid { padding: 6px 6px 24px; }
.gallery .polaroid:nth-child(4n+1) { transform: rotate(-2deg); }
.gallery .polaroid:nth-child(4n+2) { transform: rotate(1.6deg); }
.gallery .polaroid:nth-child(4n+3) { transform: rotate(1.2deg); }
.gallery .polaroid:nth-child(4n) { transform: rotate(-1.4deg); }
.gallery .polaroid.tall .ph { aspect-ratio: 3 / 4; }
.gallery .polaroid figcaption { bottom: 2px; }

/* ===== 일정 ===== */
.chips {
  display: flex; gap: 8px;
  overflow-x: auto; scrollbar-width: none;
  margin: 18px -16px 0; padding: 4px 16px 8px;
  position: sticky; top: 0; z-index: 5;
  background: linear-gradient(var(--bg) 85%, transparent);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  min-height: 48px; padding: 6px 14px;
  border-radius: 12px;
  border: 2px solid var(--navy);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer; text-align: center; line-height: 1.15;
  box-shadow: 0 3px 0 var(--navy);
}
.chip b { display: block; font: 400 16px/1.2 var(--display); letter-spacing: .03em; }
.chip span { font-size: 15px; color: var(--muted); }
.chip[aria-selected="true"] {
  background: var(--yellow); color: var(--navy); border-color: var(--navy);
}
.chip[aria-selected="true"] span { color: var(--navy); }
.chip .today { display: inline-block; margin-left: 4px; color: var(--red-ink); font-weight: 900; }
:root[data-theme="dark"] .chip { border-color: var(--pink); box-shadow: 0 0 10px rgba(255,95,162,.35); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip { border-color: var(--pink); box-shadow: 0 0 10px rgba(255,95,162,.35); } }
.filters .chip { min-height: 44px; padding: 8px 14px; font-weight: 700; font-size: 15px; }

.banner {
  position: relative; margin-top: 8px;
  border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow);
}
.banner .ph { aspect-ratio: 16 / 10; }
.banner .shade {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(27,31,59,0) 30%, rgba(27,31,59,.88) 100%);
}
.banner .txt { position: absolute; left: 16px; right: 112px; bottom: 14px; color: #fff; }
.banner .daynum { font: 400 30px/1 var(--display); color: var(--yellow); text-shadow: 0 0 10px rgba(255, 201, 60, .5); }
.banner .daydate { font-size: 15px; font-weight: 700; opacity: .9; margin-left: 6px; }
.banner h2 { margin: 6px 0 0; font-size: 18px; line-height: 1.4; font-weight: 900; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.banner .sticker {
  position: absolute; right: 12px; bottom: 12px; width: 96px;
  padding: 4px 4px 14px; background: #fff; border-radius: 4px; transform: rotate(5deg);
  box-shadow: 0 4px 12px rgba(0,0,0,.35);
}
.banner .sticker .ph { aspect-ratio: 1; border-radius: 2px; }
.banner.uniform { outline: 3px solid var(--pink); outline-offset: -3px; }
.uniform-tag {
  position: absolute; top: 12px; left: 12px;
  background: var(--pink); color: #fff; font-weight: 900; font-size: 16px;
  padding: 4px 12px; border-radius: 999px; box-shadow: 0 0 14px rgba(255,95,162,.8);
}

.timeline { list-style: none; margin: 18px 0 0; padding: 0 0 0 22px; position: relative; }
.timeline::before {
  content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px;
  background: repeating-linear-gradient(var(--pink) 0 6px, transparent 6px 12px);
  opacity: .6;
}
.tl { position: relative; margin-bottom: 12px; }
.tl::before {
  content: ""; position: absolute; left: -21px; top: 20px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--bg); border: 3px solid var(--pink);
}
.tl.star::before { background: var(--pink); box-shadow: var(--glow); }
.tl .card { padding: 12px 14px; }
.tl.star .card { border: 2px solid var(--pink); box-shadow: var(--shadow), 0 0 0 3px var(--pink-bg); }
.tl-time { font: 400 15px/1.4 var(--display); color: var(--pink-ink); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.tl-head { display: flex; gap: 12px; align-items: flex-start; }
.tl-head .main { flex: 1; min-width: 0; }
.tl-title { margin: 2px 0 0; font-size: 17px; font-weight: 700; line-height: 1.45; }
.tl-title .emo { margin-right: 4px; }
.tl-thumb { flex: 0 0 72px; width: 72px; height: 72px; border-radius: 12px; }
.tl-thumb::before { font-size: 30px; }
.tl-meta { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 15px; color: var(--ink-2); }
.tl-meta li { display: grid; grid-template-columns: 22px 1fr; gap: 4px; }
.tl-cost { font-weight: 700; color: var(--ink); }
.tl-note { margin: 8px 0 0; padding: 8px 10px; background: var(--surface-2); border-radius: 10px; font-size: 15px; color: var(--ink-2); }
.tl-note ul { margin: 0; padding-left: 18px; }
.tl-note .badge { margin: 0 0 4px; }

.daytotal {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 6px; padding: 16px;
  background: var(--navy); color: #fff; border-radius: var(--radius);
}
.daytotal b { font: 400 22px/1.2 var(--display); color: var(--yellow); }
.daytotal .won { font-size: 15px; opacity: .85; }

/* ===== 맛집 ===== */
.filters { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
.food-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 14px; }
.food { padding: 0; overflow: hidden; }
.food .ph { aspect-ratio: 16 / 9; }
.food .body { padding: 14px 16px 16px; }
.food h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.4; }
.food dl { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 15px; }
.food dt { color: var(--muted); }
.food dd { margin: 0; }
.food .memo { margin: 10px 0 0; font-size: 15px; color: var(--ink-2); background: var(--surface-2); padding: 8px 10px; border-radius: 10px; }
.food.out { opacity: .5; filter: grayscale(.7); }
.food.out h3::after { content: " · 제외"; color: var(--muted); font-weight: 500; }
.empty { text-align: center; color: var(--muted); padding: 24px; }

/* ===== 숙소 ===== */
.stay { padding: 0; overflow: hidden; }
.stay .ph { aspect-ratio: 16 / 7; }
.stay .ph::after {
  content: attr(data-city); position: absolute; left: 16px; bottom: 12px;
  font: 400 26px/1 var(--display); color: #fff; text-shadow: 0 0 12px rgba(255,95,162,.9);
}
.stay .body { padding: 16px; }
.stay h3 { margin: 0; font-size: 19px; }
.stay .dates { color: var(--pink-ink); font-weight: 700; margin-top: 2px; }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.times > div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.times span { display: block; font-size: 15px; color: var(--muted); }
.times b { font: 400 24px/1.3 var(--display); }
.addr { font-size: 15px; }
.stay ul { margin: 8px 0 0; padding-left: 20px; font-size: 15px; color: var(--ink-2); }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

/* ===== 비용 ===== */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.stat { padding: 14px; }
.stat.wide { grid-column: 1 / -1; background: var(--navy); color: #fff; border: 0; }
.stat .k { font-size: 15px; color: var(--muted); font-weight: 700; }
.stat.wide .k { color: rgba(255,255,255,.75); }
.stat .v { font: 400 clamp(22px, 6.4vw, 28px)/1.2 var(--display); margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat.wide .v { font-size: clamp(30px, 9vw, 38px); color: var(--yellow); text-shadow: 0 0 12px rgba(255,201,60,.4); }
.stat .s { font-size: 15px; color: var(--muted); }
.stat.wide .s { color: rgba(255,255,255,.75); }
.rate { margin-top: 10px; }

.bars { display: grid; gap: 12px; margin-top: 4px; }
.bar { display: grid; gap: 4px; position: relative; cursor: default; }
.bar .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.bar .lbl b { font-variant-numeric: tabular-nums; }
.bar .track { height: 14px; border-radius: 4px; background: var(--surface-2); }
.bar .fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--pink); min-width: 4px; }
.bar .tip {
  position: absolute; right: 0; top: -34px; z-index: 2;
  background: var(--navy); color: #fff; font-size: 15px; padding: 3px 10px; border-radius: 8px;
  opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; pointer-events: none;
  white-space: nowrap;
}
.bar:hover .tip, .bar:focus .tip, .bar:focus-within .tip { opacity: 1; transform: none; }
.bar:hover .fill, .bar:focus .fill { filter: brightness(1.08); }

.lines { list-style: none; margin: 0; padding: 0; }
.lines li { padding: 12px 0; border-top: 1px solid var(--line); }
.lines li:first-child { border-top: 0; padding-top: 0; }
.lines .top-row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.lines .top-row b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.lines .sub { font-size: 15px; color: var(--muted); }
.lines .sum { display: flex; justify-content: space-between; font-weight: 900; padding-top: 12px; border-top: 2px solid var(--ink); }

/* ===== 준비 ===== */
.progress { margin-top: 18px; }
.progress .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
.progress .fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--yellow)); border-radius: 999px; transition: width .3s; }
.group h3 { margin: 22px 0 8px; font-size: 17px; }
.checks { list-style: none; margin: 0; padding: 0; }
.check {
  display: grid; grid-template-columns: 44px 1fr; gap: 6px; align-items: start;
  padding: 10px 12px 10px 4px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; margin-bottom: 8px; cursor: pointer;
}
.check input { position: absolute; opacity: 0; pointer-events: none; }
.check .box {
  width: 44px; height: 44px; display: grid; place-items: center;
}
.check .box::before {
  content: ""; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted);
  display: grid; place-items: center; transition: background .15s;
}
.check input:checked + .box::before {
  content: "✓"; background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 900; font-size: 16px; line-height: 20px; text-align: center;
}
.check input:focus-visible + .box::before { outline: 3px solid var(--pink); outline-offset: 2px; }
.check .txt { padding-top: 9px; }
.check .txt b { display: block; line-height: 1.45; }
.check .txt span { font-size: 15px; color: var(--muted); }
.check.done .txt b { text-decoration: line-through; text-decoration-color: var(--pink); color: var(--muted); }

details.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; }
details.acc summary {
  min-height: 48px; padding: 12px 40px 12px 14px; cursor: pointer; font-weight: 700; list-style: none; position: relative;
}
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::after { content: "+"; position: absolute; right: 16px; top: 10px; font-size: 22px; color: var(--pink-ink); }
details.acc[open] summary::after { content: "−"; }
details.acc .in { padding: 0 14px 14px; font-size: 15px; color: var(--ink-2); }
details.acc .in p { margin: 0 0 6px; }

.tips { display: grid; gap: 10px; }
.tip-card { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
.tip-card .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--pink-bg); display: grid; place-items: center; font-size: 22px; }
.tip-card h4 { margin: 0; font-size: 16px; }
.tip-card p { margin: 2px 0 0; font-size: 15px; color: var(--ink-2); }

/* ===== 하단 ===== */
.credits { padding: 28px 16px 8px; font-size: 15px; color: var(--muted); }
.credits h2 { font-size: 16px; margin: 0 0 6px; color: var(--ink-2); }
.credits ul { margin: 0; padding-left: 18px; }
.credits a { color: var(--ink-2); }

.tabbar {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 100%; max-width: 540px; z-index: 20;
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  box-shadow: 0 -6px 20px rgba(27,31,59,.08);
}
@supports not (background: color-mix(in srgb, red 50%, blue)) { .tabbar { background: var(--surface); } }
.tabbar a {
  min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--muted); font-size: 15px; font-weight: 700; border-radius: 12px;
  -webkit-tap-highlight-color: transparent;
}
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a[aria-current="page"] { color: var(--pink-ink); }
.tabbar a[aria-current="page"] svg { filter: drop-shadow(0 0 5px rgba(255, 95, 162, .7)); }
.tabbar a[aria-current="page"] span { text-shadow: var(--glow); }

@media (min-width: 560px) {
  .app { box-shadow: 0 0 0 1px var(--line); }
}

  const DAY_BANNER = { 1: ["neon", "🏮"], 2: ["usj", "🎢"], 3: ["pontocho", "🏮"], 4: ["fushimi", "⛩️"] };

  // 이미지 로딩 실패 시 그라데이션 + 이모지만 남김 (깨진 아이콘 안 보이게)
  window.__imgFail = function (img) { img.remove(); };

  function photo(srcOrKey, emoji, cls, alt) {
    let src = srcOrKey;
    if (srcOrKey && !/[/.]/.test(srcOrKey)) src = PHOTOS[srcOrKey] && PHOTOS[srcOrKey].src;
    const img = src
      ? `<img src="${esc(src)}" alt="${esc(alt || "")}" loading="lazy" decoding="async" onerror="__imgFail(this)">`
      : "";
    return `<div class="ph ${cls || ""}" data-emoji="${esc(emoji || "📷")}">${img}<\/div>`;
  }

  // ---------- 유틸 ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const fmt = (n) => Math.round(n).toLocaleString("ko-KR");
  const yen = (n) => "¥" + fmt(n);
  const won = (n) => fmt(n) + "원";
  const yenWon = (n) => `${yen(n)} <span class="muted">· 약 ${won(n * RATE)}<\/span>`;

  function kstDate(d) {
    return new Date((d || new Date()).getTime() + 9 * 3600e3).toISOString().slice(0, 10);
  }
  function mapUrl(q) {
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  }
  const HOTEL_Q = { osaka: T.hotels[0].mapQuery, kyoto: T.hotels[1].mapQuery };

  // 일정표의 장소 칸 → 지도 검색어 (경로·모호한 곳은 링크 없음)
  function placeQuery(place) {
    let p = place.split(" / ")[0];
    if (/→/.test(p)) return null;
    if (/^숙소/.test(p) || /야마토야/.test(p)) return HOTEL_Q.osaka;
    if (/호텔 게이한/.test(p)) return HOTEL_Q.kyoto;
    p = p.replace(/\([^)]*\)/g, "").replace(/\s등$/, "").trim();
    if (!p || /근처|건너$/.test(p)) return null;
    return p;
  }
  function placeHtml(place) {
    const q = placeQuery(place);
    return q ? `<a class="maplink" href="${esc(mapUrl(q))}" target="_blank" rel="noopener">${esc(place)}<\/a>` : esc(place);
  }

  // 확인 필요 표시가 붙어야 하는 값인지
  const needsCheck = (s) => /확인/.test(s || "");
  const checkBadge = '<span class="badge yellow">⚠ 확인 필요<\/span>';

  const EMOJI_RE = /^(\p{Extended_Pictographic}(\uFE0F|\u200D\p{Extended_Pictographic})*)\s*/u;
  function itemEmoji(it) {
    const t = it.title + " " + it.place;
    const rules = [
      [/비행|귀국/, "✈️"], [/셔틀/, "🚌"], [/라피트|하루카|이동|복귀|출발/, "🚃"], [/수속|입국|수하물|키오스크/, "🛄"],
      [/대욕장/, "♨️"], [/기상/, "☀️"], [/체크인|체크아웃|짐|숙소/, "🧳"], [/게이트/, "🎟️"],
      [/기요미즈|신사|이나리|야사카/, "⛩️"], [/에키벤/, "🍱"], [/아침/, "🍙"], [/저녁|간식/, "🍿"],
      [/산책|구경|시라카와|산넨자카/, "🚶"],
    ];
    for (const [re, e] of rules) if (re.test(t)) return e;
    return "📍";
  }
  function mealPhoto(it) {
    const t = it.title + " " + it.place;
    const map = [
      [/야타이|ミナモ/, "yatai", "🏮"], [/라멘/, "ramen", "🍜"], [/팬케이크/, "pancake", "🥞"],
      [/타코야키/, "takoyaki", "🐙"], [/로바타/, "robata", "🔥"], [/장어/, "unagi", "🍱"],
      [/스키야키/, "sukiyaki", "🥩"], [/에키벤/, "ekiben", "🍱"], [/이자카야|바$|골목/, "izakaya", "🍺"],
    ];
    for (const [re, key, e] of map) if (re.test(t)) return [key, e];
    return [null, it.cat === "식비" ? "🍽️" : "☕"];
  }
  function foodPhoto(f) {
    const n = f.name;
    const map = [
      [/무겐/, "ramen", "🍜"], [/COLONY/, "pancake", "🥞"], [/앗치치/, "takoyaki", "🐙"], [/미나모/, "yatai", "🏮"],
      [/이사리비|다누키/, "robata", "🔥"], [/사시스|센료/, "sushi", "🍣"], [/우나기/, "unagi", "🍱"],
      [/이즈모야/, "sukiyaki", "🥩"], [/구로몬/, "market", "🦀"], [/텐푸라/, null, "🍤"], [/규카츠/, null, "🥩"],
    ];
    for (const [re, key, e] of map) if (re.test(n)) return [key, e];
    return [null, "🍽️"];
  }

  // ---------- 상태 ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 실패해도 화면은 동작 */ } },
  };
  let currentDay = null;
  let foodFilter = "all";

  // ---------- D-day ----------
  function ddayState(now) {
    now = now || new Date();
    const today = kstDate(now);
    const idx = TRIP_DATES.indexOf(today);
    if (now < DEPART) {
      const days = Math.round((Date.parse(TRIP_DATES[0]) - Date.parse(today)) / 864e5);
      return { phase: "before", big: days === 0 ? "D-DAY" : "D-" + days, sub: "10/24(토) 15:20 인천 출발까지" };
    }
    if (idx >= 0) return { phase: "during", big: "DAY " + (idx + 1), sub: "지금 여행 중! 즐겁게 💕", day: idx + 1 };
    return { phase: "after", big: "다녀왔어요!", sub: "2026.10.24 ~ 10.27 오사카·교토" };
  }
  function clockText(now) {
    let s = Math.max(0, Math.floor((DEPART - now) / 1000));
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    const m = Math.floor(s / 60); s %= 60;
    const p = (n) => String(n).padStart(2, "0");
    return `${d}일 ${p(h)}:${p(m)}:${p(s)}`;
  }
  let clockTimer = null;

  // ---------- 화면: 홈 ----------
  function parseFlight(label) {
    const it = T.summary.items.find((x) => x.label === label);
    if (!it) return null;
    const [main, ...rest] = it.text.split("※");
    const m = main.trim().match(/^(\S+)\s+(\S+)\s+(\S+)\s+(.+?)\s+(\d\d:\d\d)\s*→\s*(.+?)\s+(\d\d:\d\d)/);
    if (!m) return { raw: it.text };
    return { date: m[1], airline: m[2], code: m[3], from: m[4], dep: m[5], to: m[6], arr: m[7], note: rest.join("※").trim() };

  function flightCard(title, f) {
    if (!f) return "";
    if (f.raw) return `<div class="card"><h3>${esc(title)}<\/h3><p>${esc(f.raw)}<\/p><\/div>`;
    const to = esc(f.to).replace("김포", '<b style="color:var(--red-ink)">김포<\/b>');
    return `<div class="card">
      <div class="flight-head"><h3>${esc(title)} · ${esc(f.date)}<\/h3><span class="badge pink">${esc(f.airline)} ${esc(f.code)}<\/span><\/div>
      <div class="flight">
        <div class="pt"><b>${esc(f.dep)}<\/b><span>${esc(f.from)}<\/span><\/div>
        <div class="plane" aria-hidden="true">✈<\/div>
        <div class="pt"><b>${esc(f.arr)}<\/b><span>${to}<\/span><\/div>
      <\/div>
      ${f.note ? `<div class="flight-note">※ ${esc(f.note)}<\/div>` : ""}

  }
  function mustTimes() {
    const row = T.prep.find((p) => /꼭 지킬/.test(p.status));
    if (!row) return "";
    const lis = row.item.split(" · ").map((chunk) => {
      const m = chunk.trim().match(/^(\d+\/\d+)\s+(.*)$/);
      if (!m) return `<li><span class="d"><\/span><span class="t">${esc(chunk)}<\/span><\/li>`;
      const parts = m[2].split(" / ").map((p) => {
        const t = p.trim().match(/^(\d\d:\d\d)\s*(.*)$/);
        return t ? `<span><b>${t[1]}<\/b>${esc(t[2])}<\/span>` : `<span>${esc(p)}<\/span>`;
      });
      return `<li><span class="d">${m[1]}<\/span><span class="t">${parts.join("")}<\/span><\/li>`;
    });
    return `<ul class="must">${lis.join("")}<\/ul>`;
  }
  function renderHome() {

    const headline = concept.split(".")[0];

        <\/figure>
        <div class="dday" aria-live="polite">
          <div class="big" id="ddayBig">${esc(st.big)}<\/div>
          <div class="sub">${esc(st.sub)}<\/div>
          ${st.phase === "before" ? `<div class="clock" id="ddayClock">${clockText(new Date())}<\/div>` : ""}
          <p class="concept">"<em>${esc(headline)}<\/em>"<\/p>
          <p class="small muted" style="margin:4px 0 0">2026.10.24(토) ~ 10.27(화) · 2인<\/p>
        <\/div>
      <\/section>

      <h2 class="section-title">✈️ <span class="glow">비행기<\/span><\/h2>

      <div class="card">${mustTimes()}<\/div>

      <h2 class="section-title">📸 <span class="glow">우리 둘<\/span><\/h2>
      <div class="gallery">
        ${US.gallery.map(([src, cap, tall]) => `
          <figure class="polaroid ${tall ? "tall" : ""}" style="margin:0">
            ${photo(src, "💗", "", cap)}<figcaption>${esc(cap)}<\/figcaption>

  function startClock() {
    clearInterval(clockTimer);
    const el = document.getElementById("ddayClock");
    if (!el) return;
    clockTimer = setInterval(() => {

  // ---------- 화면: 일정 ----------
  function noteHtml(note) {
    if (!note) return "";
    const parts = note.split(" / ").map((s) => s.trim()).filter(Boolean);
    const badge = needsCheck(note) ? checkBadge : "";
    return `<div class="tl-note">${badge}<ul>${parts.map((p) => `<li>${esc(p)}<\/li>`).join("")}<\/ul><\/div>`;
  }
  function timelineItem(it) {
    let title = it.title.replace(/^★\s*/, "");
    let emo;
    const m = title.match(EMOJI_RE);
    if (m) { emo = m[1]; title = title.slice(m[0].length); } else { emo = itemEmoji(it); }
    const isMeal = it.cat === "식비" && !/편의점/.test(it.place);
    let thumb = "";
    if (isMeal) { const [k, e] = mealPhoto(it); thumb = photo(k, e, "tl-thumb", ""); }
    const meta = [];
    if (it.place) meta.push(`<li><span aria-hidden="true">📍<\/span><span>${placeHtml(it.place)}<\/span><\/li>`);
    if (it.move || it.moveTime) meta.push(`<li><span aria-hidden="true">🚶<\/span><span>${esc([it.move, it.moveTime].filter(Boolean).join(" · "))}<\/span><\/li>`);
    if (it.yen) meta.push(`<li><span aria-hidden="true">💴<\/span><span class="tl-cost">1인 ${yenWon(it.yen)}<\/span><\/li>`);
    return `<li class="tl ${it.star ? "star" : ""}">
      <div class="card">
        <div class="tl-head">
          <div class="main">
            <div class="tl-time">${esc(it.time)}${it.star ? ' <span class="badge pink">★ 중요<\/span>' : ""}<\/div>
            <h3 class="tl-title"><span class="emo" aria-hidden="true">${emo}<\/span>${esc(title)}<\/h3>
          <\/div>
          ${thumb}

        ${meta.length ? `<ul class="tl-meta">${meta.join("")}<\/ul>` : ""}
        ${noteHtml(it.note)}

  function renderPlan() {
    const todayIdx = TRIP_DATES.indexOf(kstDate());
    if (currentDay == null) currentDay = todayIdx >= 0 ? todayIdx + 1 : 1;
    const d = T.days.find((x) => x.day === currentDay) || T.days[0];

      <div class="chips" role="tablist" aria-label="날짜 선택">${chips}<\/div>
      <section class="banner ${uniform ? "uniform" : ""}">

  // ---------- 화면: 맛집 ----------
  const isKyoto = (f) => /교토|폰토초/.test(f.area);
  const needsReserve = (f) => /★|필수|권장/.test(f.reserve);
  const FILTERS = [
    ["all", "전체", () => true], ["osaka", "오사카", (f) => !isKyoto(f)], ["kyoto", "교토", isKyoto],
    ["reserve", "예약필요", needsReserve], ["alt", "대안", (f) => f.slot === "대안"],
  ];
  function valueHtml(v) {
    if (!v) return '<span class="muted">-<\/span>';
    if (/^확인( 필요)?$/.test(v)) return checkBadge;
    return esc(v) + (needsCheck(v) ? " " + checkBadge : "");
  }
  function foodCard(f) {
    const [k, e] = foodPhoto(f);
    const out = f.slot === "제외";
    const badges = [`<span class="badge">${esc(f.area)}<\/span>`, `<span class="badge ${f.slot === "대안" || out ? "" : "pink"}">${esc(f.slot)}<\/span>`, `<span class="badge">${esc(f.kind)}<\/span>`];
    if (/현금/.test(f.pay)) badges.push('<span class="badge red">💴 현금만<\/span>');
    if (needsReserve(f)) badges.push(`<span class="badge pink">📞 예약 ${esc(f.reserve.replace(/★/g, "").split(" ")[0])}<\/span>`);
    return `<article class="card food ${out ? "out" : ""}">
      ${photo(k, e, "", f.name)}
      <div class="body">
        <h3><a class="maplink" href="${esc(mapUrl(f.name.replace(/\s*\(.*\)$/, "") + (isKyoto(f) ? " 京都" : " 大阪")))}" target="_blank" rel="noopener">${esc(f.name)}<\/a><\/h3>
        <div class="badges">${badges.join("")}<\/div>
        <dl>
          <dt>영업시간<\/dt><dd>${valueHtml(f.hours)}<\/dd>
          <dt>예약<\/dt><dd>${valueHtml(f.reserve)}<\/dd>
          <dt>결제<\/dt><dd>${/현금/.test(f.pay) ? '<span class="badge red">현금만<\/span>' : valueHtml(f.pay)}<\/dd>
          <dt>가격대<\/dt><dd>${valueHtml(f.price)}<\/dd>
        <\/dl>
        ${f.memo ? `<p class="memo">${esc(f.memo)}<\/p>` : ""}
      <\/div>
    <\/article>`;
  }
  function renderFood() {
    const fn = (FILTERS.find((x) => x[0] === foodFilter) || FILTERS[0])[2];
    const list = T.food.filter(fn);
    const main = list.filter((f) => f.slot !== "제외");
    const out = list.filter((f) => f.slot === "제외");
    return `
      <h2 class="section-title" style="margin-top:22px">🍜 <span class="glow">맛집 리스트<\/span><\/h2>

      <\/div>

  // ---------- 화면: 숙소 ----------
  function renderStay() {
    return `
      <h2 class="section-title" style="margin-top:22px">🏨 <span class="glow">숙소<\/span><\/h2>
      <div class="stack">
      ${T.hotels.map((h, i) => `
        <article class="card stay">

              <div><span>체크아웃<\/span><b>${esc(h.checkout)}<\/b>${h.checkoutCheck ? checkBadge : ""}<\/div>

  // ---------- 화면: 비용 ----------
  function renderCost() {
    const c = T.cost;
    const bars = c.future.filter((f) => f.won > 0);

    const short = (l) => l.replace(/\s*\(.*\)$/, "");
    return `
      <div class="stats">
        <div class="card stat wide"><div class="k">총 여행비 (2인)<\/div><div class="v">${won(c.totalWon)}<\/div><div class="s">이미 결제 ${won(c.paidWon)} + 앞으로 ${won(c.futureWon)}<\/div><\/div>

        <div class="card stat"><div class="k">1인당 추가 지출<\/div><div class="v">${won(c.perPersonFutureWon)}<\/div><div class="s">${yen(c.perPersonFutureYen)}<\/div><\/div>
      <\/div>

          <\/li>`).join("")}

        <\/ul>
      <\/div>

      <h2 class="section-title">👛 <span class="glow">앞으로 쓸 돈<\/span><\/h2>
      <div class="card">
        <ul class="lines">
          ${c.future.map((f) => `<li>
            <div class="top-row"><span>${esc(f.label)}<\/span><b>${won(f.won)}<\/b><\/div>
            <div class="sub">1인 ${yen(f.perYen)} × ${f.count}명 = ${yen(f.yen)} · ${esc(f.note)}${needsCheck(f.note) ? " " + checkBadge : ""}<\/div>
          <\/li>`).join("")}
          <li class="sum"><span>소계<\/span><span>${won(c.futureWon)}<\/span><\/li>
        <\/ul>
      <\/div>
      ${c.notes.map((n) => `<p class="small muted">${esc(n)}<\/p>`).join("")}`;
  }

  // ---------- 화면: 준비 ----------
  const GROUPS = [
    ["🔴", "🔴 지금"], ["🟡", "🟡 전날까지"], ["🧾", "🧾 출발 전"], ["🏨", "🏨 현지"],
    ["📱", "📱 당일"], ["⚪", "⚪ 선택"], ["✅", "✅ 완료"],
  ];
  const TIPS = [
    ["🚄", "라피트 (공항 → 난바)", "약 38분 · 전석 지정석 · 짐칸. 항공 지연 대비 시간 고정 티켓은 피하거나 현장 발권."],
    ["🚅", "하루카 (교토 → 공항)", "교토역 10:15~10:45 출발편 권장 · 마지노선은 11:00 출발편. 피치 체크인 13:20 마감."],
    ["💳", "교통카드 1인 1개", "ICOCA 등 하나씩. JR·교토 시버스는 신용카드 터치결제 안 됨."],
    ["🚫", "택시는 안 타요", "전철·지하철·버스·도보만. 주소 → 숙소 막차는 늦어도 23:20 출발."],
  ];
  const prepKey = (p) => "osaka-prep:" + p.item;
  function isChecked(p) { return store.get(prepKey(p), /완료/.test(p.status)); }
  function renderPrep() {
    const items = T.prep.filter((p) => !/꼭 지킬/.test(p.status));
    const done = items.filter(isChecked).length;
    const groups = GROUPS.map(([icon, label]) => {
      const g = items.filter((p) => p.status.startsWith(icon));
      if (!g.length) return "";
      return `<section class="group"><h3>${label}<\/h3><ul class="checks">
        ${g.map((p) => { const on = isChecked(p); return `<li><label class="check ${on ? "done" : ""}">
          <input type="checkbox" data-key="${esc(prepKey(p))}" ${on ? "checked" : ""}><span class="box" aria-hidden="true"><\/span>
          <span class="txt"><b>${esc(p.item)}<\/b><span>${esc(p.memo)}<\/span><\/span>

      <\/ul><\/section>`;
    }).join("");

  // ---------- 사진 출처 ----------
  function renderCredits() {
    const used = Object.values(PHOTOS).filter(Boolean);
    document.getElementById("credits").innerHTML = `
      <h2>사진 출처<\/h2>
      <p style="margin:0 0 6px">우리 사진 © 형원 · 수민. 그 외 사진은 Wikimedia Commons 자유 라이선스 이미지입니다.<\/p>
      <ul>${used.map((p) => `<li><a href="${esc(p.credit.url)}" target="_blank" rel="noopener">${esc(p.credit.file)}<\/a> — ${esc(p.credit.author)}, ${esc(p.credit.license)}<\/li>`).join("")}<\/ul>`;
  }

  // ---------- 라우터 ----------
  const VIEWS = { home: renderHome, plan: renderPlan, food: renderFood, stay: renderStay, cost: renderCost, prep: renderPrep };
  const view = document.getElementById("view");
  function tabName() { const h = location.hash.slice(1); return VIEWS[h] ? h : "home"; }
  function render() {
    const tab = tabName();
    view.innerHTML = VIEWS[tab]();
    document.querySelectorAll(".tabbar a").forEach((a) => {
      if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (tab === "home") startClock(); else clearInterval(clockTimer);
    if (tab === "plan") {
      const sel = view.querySelector('.chip[aria-selected="true"]');
      if (sel) sel.scrollIntoView({ block: "nearest", inline: "center" });
    }
  }
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  view.addEventListener("click", (e) => {
    const day = e.target.closest("[data-day]");
    if (day) {
      currentDay = +day.dataset.day;
      const chipsTop = view.querySelector(".chips").getBoundingClientRect().top + window.scrollY;
      render();
      if (window.scrollY > chipsTop) window.scrollTo(0, chipsTop);
      return;
    }
    const f = e.target.closest("[data-filter]");
    if (f) { foodFilter = f.dataset.filter; render(); return; }
    const c = e.target.closest("[data-copy]");
    if (c) {
      const text = c.dataset.copy;
      const ok = () => { const o = c.textContent; c.textContent = "복사됨 ✓"; setTimeout(() => (c.textContent = o), 1400); };
      try { navigator.clipboard.writeText(text).then(ok, () => prompt("복사해서 쓰세요", text)); }
      catch (err) { prompt("복사해서 쓰세요", text); }
    }
  });
  view.addEventListener("change", (e) => {
    const cb = e.target.closest("input[data-key]");
    if (!cb) return;
    store.set(cb.dataset.key, cb.checked);
    cb.closest(".check").classList.toggle("done", cb.checked);
    const all = view.querySelectorAll("input[data-key]");
    const done = [...all].filter((x) => x.checked).length;
    document.getElementById("progTxt").textContent = `${done} / ${all.length}`;
    document.getElementById("progFill").style.width = (done / all.length) * 100 + "%";
  });

  // 사귄 날(2026.9.27)을 1일로 세는 D+n
  function renderTogether() {
    const el = document.getElementById("together");
    if (!el) return;
    const n = Math.round((Date.parse(kstDate()) - Date.parse(START_DATE)) / 864e5) + 1;
    el.innerHTML = `<svg class="mini-heart" aria-hidden="true"><use href="#heart"/><\/svg> 우리 사랑한 지 <b>D+${n}<\/b>`;
    el.hidden = false;
  }

  renderTogether();
  renderCredits();
  render();
})();
</script>
</body>
</html>
